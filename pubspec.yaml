name: mta
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  go_router: ^14.2.7
  http: ^1.6.0
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: images/ic_launcher.png
  min_sdk_android: 21
  android: true
  adaptive_icon_background: images/ic_launcher_background.png
  adaptive_icon_foreground: images/ic_launcher_foreground.png
  adaptive_icon_monochrome: images/ic_launcher_monochrome.png
  adaptive_icon_foreground_inset: 12
